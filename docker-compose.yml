services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  api:
    image: research-papers-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://research:research@postgres:5432/research_graph
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_LOCAL_ROOT: /data/document-storage
    ports:
      - "8000:8000"
    volumes:
      - document_storage_data:/data/document-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: research-papers-backend:local
    pull_policy: never
    command: python -m app.workers.research_worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://research:research@postgres:5432/research_graph
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_LOCAL_ROOT: /data/document-storage
    volumes:
      - document_storage_data:/data/document-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: research_graph
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research_graph"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs-volume-permission:
    image: alpine:3.22
    profiles: ["service-integration"]
    command: sh -c "chown -R 10001:10001 /data"
    volumes:
      - rustfs_data:/data
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.0
    profiles: ["service-integration"]
    security_opt:
      - "no-new-privileges:true"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: research
      RUSTFS_SECRET_KEY: research-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - rustfs_data:/data
    depends_on:
      rustfs-volume-permission:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  document_storage_data:
  rustfs_data:
