[project]
name = "research-papers-pet"
version = "0.1.0"
description = "MVP for exploring citation neighborhoods of scientific papers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "boto3>=1.40,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "networkx>=3.5,<4",
    "openpyxl>=3.1,<4",
    "pandas>=2.3,<3",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "redis>=6.4,<7",
    "sentence-transformers>=5.1,<6",
    "sqlalchemy>=2.0,<3",
    "tenacity>=9.1,<10",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend"]
testpaths = ["tests"]
markers = [
    "service_integration: tests that require real local Docker services",
    "external: tests that call external services and require explicit opt-in",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
